{% extends "base.html" %}

{% block title %}Payment Failed | airodrone{% endblock %}

{% block content %}
<section style="background: var(--color-bg-alt, #f8fafc); padding: 3rem 0 5rem 0;">
    <div class="container" style="max-width: 600px; margin: 0 auto;">
        
        <div style="background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 3rem 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;">
            
            <div style="width: 72px; height: 72px; background: #fee2e2; color: #dc2626; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem auto; font-size: 2.2rem; font-weight: 800;">
                ✕
            </div>

            <h1 style="font-size: 2rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">
                Payment Failed
            </h1>
            <p style="font-size: 1.05rem; color: #475569; margin-bottom: 2rem; line-height: 1.6;">
                Your payment could not be completed or signature verification failed. No charges were processed.
            </p>

            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="{{ url_for('public_products') }}" class="btn btn-primary" style="padding: 0.85rem 1.75rem; font-size: 1.05rem; font-weight: 700; border-radius: 10px; background: #2563eb; color: #ffffff; text-decoration: none;">
                    Try Again
                </a>
            </div>

        </div>

    </div>
</section>
{% endblock %}
