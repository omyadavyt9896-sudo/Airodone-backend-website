{% extends "base.html" %}

{% block title %}Set New Password | airodrone{% endblock %}

{% block content %}
<section class="page-hero">
    <div class="container page-hero-inner">
        <div>
            <h1>Set New Password</h1>
            <p>Please enter a secure password combining letters and numbers (min 8 characters).</p>
        </div>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="contact-form-wrapper" style="max-width: 500px; margin: 0 auto;">
            {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" class="contact-form">
                {% if csrf_token %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />{% endif %}
                <div class="form-field">
                    <label for="password">New Password<span class="required">*</span></label>
                    <div class="input-icon-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" name="password" required placeholder="Enter new password">
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Save Password</button>
                </div>
            </form>
            <script>
                document.getElementById('togglePassword').addEventListener('click', function () {
                    const pwdInput = document.getElementById('password');
                    const isPassword = pwdInput.type === 'password';
                    pwdInput.type = isPassword ? 'text' : 'password';
                    this.style.opacity = isPassword ? '1' : '0.6';
                });
            </script>
        </div>
    </div>
</section>
{% endblock %}
