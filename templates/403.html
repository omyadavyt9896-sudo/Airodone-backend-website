{% extends "base.html" %}

{% block title %}403 Forbidden - airodrone{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1rem; text-align: center;">
    <div style="max-width: 600px; margin: 0 auto; background: var(--card-bg, #ffffff); border-radius: 12px; padding: 3rem 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid rgba(226, 232, 240, 0.8);">
        <div style="font-size: 4rem; color: #ef4444; margin-bottom: 1rem; font-weight: 700;">403</div>
        <h1 style="font-size: 1.75rem; margin-bottom: 1rem; color: var(--text-color, #0f172a);">Access Denied / Forbidden</h1>
        <p style="color: #64748b; margin-bottom: 2rem; font-size: 1.05rem;">
            You do not have the required permissions to access this page or perform this action.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="{{ url_for('admin') if current_user.is_authenticated and (current_user.is_admin() or current_user.is_sub_admin() or current_user.is_teacher()) else url_for('dashboard') }}" class="btn btn-primary" style="padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 8px;">
                Return to Dashboard
            </a>
            <a href="{{ url_for('home') }}" class="btn btn-secondary" style="padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 8px;">
                Go to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
